<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        AI Travel & Tourism
        {% endblock %}
    </title>

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/main.css') }}">

    <!-- Responsive CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/responsive.css') }}">

    <!-- Page-specific CSS -->
    {% block extra_css %}{% endblock %}


</head>

<body>


    <!-- =========================================
         HEADER / NAVBAR
         ========================================= -->

    <header class="navbar">


        <!-- LOGO -->

        <a href="/"
           class="navbar-logo">

            <span class="logo-icon">
                🌍
            </span>

            <span class="logo-text">
                AI Travel
            </span>

        </a>


        <!-- =====================================
             NAVIGATION
             ===================================== -->

        <nav class="nav-links">


            <!-- HOME -->

            <a href="/"
               class="nav-link">

                <span class="nav-link-text">
                    Home
                </span>

            </a>


            <!-- PLANNING -->

            <a href="/planning" class="nav-link">
                <span class="nav-link-text">
                    Planning
                </span>
            </a>


            <!-- FAVORITES -->

            <a href="/favorites"
               class="nav-link favorite-nav-link">

                <span class="favorite-nav-icon">
                    ♡
                </span>

                <span class="nav-link-text">
                    Favorites
                </span>

            </a>


            <!-- PROFILE -->

            <a href="/profile"
               class="nav-link">

                <span class="profile-nav-icon">
                    👤
                </span>

                <span class="nav-link-text">
                    Profile
                </span>

            </a>


        </nav>


        <!-- =====================================
             RIGHT SIDE ACTIONS
             ===================================== -->

        <div class="nav-actions">





            <!-- MOBILE MENU -->

            <button id="menuToggle"
                    class="icon-button mobile-menu"
                    aria-label="Toggle navigation menu"
                    type="button">

                ☰

            </button>


        </div>


    </header>



    <!-- =========================================
         OPTIONAL BACK BUTTON
         ========================================= -->

    {% block back_button %}

    {% endblock %}



    <!-- =========================================
         MAIN CONTENT
         ========================================= -->

    <main>

        {% block content %}

        {% endblock %}

    </main>



    <!-- =========================================
         FOOTER
         ========================================= -->

    <footer class="footer">

        <p>
            🌍 AI Travel & Tourism
        </p>

        <p>
            Intelligent travel planning powered by AI
        </p>

    </footer>



    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <!-- Main JavaScript -->

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>




    <!-- Page-specific JavaScript -->

    {% block extra_js %}

    {% endblock %}


</body>

</html>
